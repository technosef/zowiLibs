<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft hesabı oturum açma ekranı</title>
  <desc id="desc">Kullanıcı adı alanı ve Microsoft hesabı ile oturum açma seçeneklerini gösteren Windows karşılama ekranı.</desc>
  <rect width="960" height="540" rx="32" fill="#1d4ed8" />
  <rect x="140" y="90" width="680" height="360" rx="28" fill="#f8fafc" />
  <text x="190" y="160" font-family="'Segoe UI Semibold',sans-serif" font-size="28" fill="#0f172a">Microsoft ile oturum açın</text>
  <text x="190" y="195" font-family="'Segoe UI',sans-serif" font-size="18" fill="#334155">Hesabınızı ekleyerek ayarlarınızı senkronize edin.</text>
  <rect x="190" y="230" width="520" height="60" rx="18" fill="#e2e8f0" />
  <text x="210" y="265" font-family="'Segoe UI',sans-serif" font-size="20" fill="#1e293b">eposta@ornek.com</text>
  <rect x="190" y="310" width="240" height="58" rx="18" fill="#2563eb" />
  <text x="310" y="345" text-anchor="middle" font-family="'Segoe UI Semibold',sans-serif" font-size="20" fill="#ffffff">İleri</text>
  <rect x="450" y="310" width="260" height="58" rx="18" fill="#e0e7ff" />
  <text x="580" y="345" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="18" fill="#312e81">Çevrimdışı hesap</text>
</svg>
