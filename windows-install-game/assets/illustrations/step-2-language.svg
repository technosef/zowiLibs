<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Dil ve klavye seçimi ekranı</title>
  <desc id="desc">Dil, saat ve klavye seçenekleri için açılır menüler bulunan Windows kurulum ekranı çizimi.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="32" fill="url(#bg2)" />
  <rect x="140" y="90" width="680" height="360" rx="26" fill="#ffffff" stroke="#dbeafe" stroke-width="3" />
  <text x="480" y="150" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="30" fill="#1d4ed8">Windows Kurulumu</text>
  <text x="200" y="210" font-family="'Segoe UI',sans-serif" font-size="22" fill="#1f2937">Dil (kurulum için)</text>
  <rect x="200" y="225" width="520" height="54" rx="14" fill="#f1f5f9" />
  <text x="220" y="258" font-family="'Segoe UI',sans-serif" font-size="20" fill="#1d4ed8">Türkçe (Türkiye)</text>
  <text x="200" y="305" font-family="'Segoe UI',sans-serif" font-size="22" fill="#1f2937">Saat ve para birimi biçimi</text>
  <rect x="200" y="320" width="520" height="54" rx="14" fill="#f1f5f9" />
  <text x="220" y="353" font-family="'Segoe UI',sans-serif" font-size="20" fill="#1f2937">Türkçe (Türkiye)</text>
  <text x="200" y="400" font-family="'Segoe UI',sans-serif" font-size="22" fill="#1f2937">Klavye veya giriş yöntemi</text>
  <rect x="200" y="415" width="520" height="54" rx="14" fill="#e0e7ff" />
  <text x="220" y="448" font-family="'Segoe UI',sans-serif" font-size="20" fill="#1e3a8a">Türkçe Q Klavye</text>
</svg>
