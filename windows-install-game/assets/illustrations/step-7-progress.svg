<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kurulum ilerleme ekranı</title>
  <desc id="desc">Windows kurulumunda dosyaların kopyalandığını gösteren ilerleme çubuğu çizimi.</desc>
  <rect width="960" height="540" rx="32" fill="#1d4ed8" />
  <rect x="160" y="140" width="640" height="260" rx="30" fill="#e2e8f0" opacity="0.96" />
  <text x="220" y="210" font-family="'Segoe UI',sans-serif" font-size="28" fill="#1f2937">Windows yükleniyor</text>
  <g font-family="'Segoe UI',sans-serif" font-size="20" fill="#334155">
    <text x="220" y="250">• Dosyalar kopyalanıyor (%65)</text>
    <text x="220" y="280">• Özellikler yükleniyor</text>
    <text x="220" y="310">• Güncellemeler uygulanıyor</text>
  </g>
  <rect x="220" y="340" width="520" height="28" rx="14" fill="#c7d2fe" />
  <rect x="220" y="340" width="360" height="28" rx="14" fill="#2563eb" />
  <text x="480" y="365" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="18" fill="#0f172a">%65 tamamlandı</text>
</svg>
