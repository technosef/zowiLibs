<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Gizlilik ayarları ekranı</title>
  <desc id="desc">Konum, reklam ve tanılama seçeneklerinin anahtarlarını gösteren Windows gizlilik ekranı çizimi.</desc>
  <rect width="960" height="540" rx="32" fill="#0f172a" />
  <rect x="130" y="80" width="700" height="380" rx="28" fill="#f8fafc" />
  <text x="190" y="150" font-family="'Segoe UI Semibold',sans-serif" font-size="28" fill="#0f172a">Gizlilik ayarlarınızı seçin</text>
  <g font-family="'Segoe UI',sans-serif" font-size="20" fill="#1e293b">
    <text x="200" y="210">Reklam kimliği</text>
    <text x="200" y="260">Konum hizmeti</text>
    <text x="200" y="310">Tanılama verileri</text>
  </g>
  <g fill="#cbd5f5" stroke="#6366f1" stroke-width="3">
    <rect x="520" y="185" width="120" height="40" rx="20" fill="#0f172a" />
    <circle cx="540" cy="205" r="16" fill="#f87171" />
    <rect x="520" y="235" width="120" height="40" rx="20" fill="#2563eb" />
    <circle cx="620" cy="255" r="16" fill="#bfdbfe" />
    <rect x="520" y="285" width="120" height="40" rx="20" fill="#2563eb" />
    <circle cx="620" cy="305" r="16" fill="#bfdbfe" />
  </g>
  <text x="200" y="370" font-family="'Segoe UI',sans-serif" font-size="18" fill="#475569">Önerilen ayarlar: Reklam kapalı, konum açık, tanılama temel.</text>
</svg>
