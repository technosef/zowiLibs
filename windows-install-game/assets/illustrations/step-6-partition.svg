<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Disk bölümlendirme ekranı</title>
  <desc id="desc">Yeni bölüm oluşturma seçeneklerini ve disk tablosunu gösteren Windows kurulum ekranı.</desc>
  <rect width="960" height="540" rx="32" fill="#1e3a8a" />
  <rect x="120" y="80" width="720" height="380" rx="26" fill="#f8fafc" />
  <text x="160" y="140" font-family="'Segoe UI',sans-serif" font-size="26" fill="#0f172a">Windows'u nereye yüklemek istiyorsunuz?</text>
  <rect x="150" y="170" width="660" height="170" rx="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" />
  <g font-family="'Segoe UI',sans-serif" font-size="18" fill="#312e81">
    <text x="180" y="205">Sürücü 0 Ayrılmamış Alan</text>
    <text x="600" y="205">120000 MB</text>
    <line x1="180" y1="220" x2="780" y2="220" stroke="#6366f1" stroke-width="1.5" />
    <text x="180" y="250">Durum: Ayrılmamış</text>
    <text x="180" y="280">Tür: Temel</text>
  </g>
  <rect x="160" y="360" width="200" height="54" rx="16" fill="#2563eb" />
  <text x="260" y="394" text-anchor="middle" font-family="'Segoe UI Semibold',sans-serif" font-size="20" fill="#ffffff">Yeni</text>
  <rect x="380" y="360" width="200" height="54" rx="16" fill="#e2e8f0" />
  <text x="480" y="394" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="20" fill="#1f2937">Biçimlendir</text>
  <rect x="600" y="360" width="200" height="54" rx="16" fill="#e2e8f0" />
  <text x="700" y="394" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="20" fill="#1f2937">Sil</text>
</svg>
