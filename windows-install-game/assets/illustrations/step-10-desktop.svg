<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Windows masaüstü karşılama</title>
  <desc id="desc">Görev çubuğu ve Başlat menüsü bulunan ilk masaüstü açılış ekranı çizimi.</desc>
  <rect width="960" height="540" rx="32" fill="#2563eb" />
  <rect x="80" y="60" width="800" height="420" rx="24" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3" />
  <rect x="80" y="420" width="800" height="60" fill="#111827" opacity="0.85" />
  <g fill="#bfdbfe">
    <rect x="110" y="440" width="36" height="36" rx="8" fill="#3b82f6" />
    <rect x="160" y="440" width="36" height="36" rx="8" fill="#0ea5e9" />
    <rect x="210" y="440" width="36" height="36" rx="8" fill="#10b981" />
  </g>
  <rect x="120" y="120" width="240" height="260" rx="20" fill="rgba(15,23,42,0.65)" />
  <text x="140" y="160" font-family="'Segoe UI Semibold',sans-serif" font-size="24" fill="#e2e8f0">Başlat</text>
  <g font-family="'Segoe UI',sans-serif" font-size="18" fill="#cbd5f5">
    <text x="140" y="200">Ayarlar</text>
    <text x="140" y="230">Dosya Gezgini</text>
    <text x="140" y="260">Microsoft Store</text>
    <text x="140" y="290">Windows Update</text>
  </g>
  <rect x="400" y="140" width="360" height="200" rx="24" fill="#93c5fd" opacity="0.85" />
  <text x="580" y="240" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="46" fill="#1e3a8a">Merhaba!</text>
</svg>
